# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
# Конфигурация CodeRabbit.
#
# auto_review.base_branches: по умолчанию auto-review запускается только для PR
# с base = default-ветка (main). Рабочий процесс репозитория — интеграционные ветки
# фаз (phase-3, ...), в которые открываются PR отдельных задач (например, M-000),
# поэтому включаем auto-review и для них. Паттерны — регулярные выражения.
#
# path_filters: ревьюим весь репозиторий, исключая только build-артефакты.
# Ранее здесь был allowlist отдельных пакетов — он молча скрывал от ревью новые
# пакеты (например, packages/foundation/message-bus в PR #55) и содержал
# опечатанные пути (legder, maket-discovery), не матчившие ничего.
reviews:
  auto_review:
    base_branches:
      - "phase-.*"
  path_filters:
    - "!dist/**"
    - "!node_modules/**"
    - "!coverage/**"
